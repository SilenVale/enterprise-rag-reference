[project]
name = "enterprise-rag"
version = "0.0.1"
description = "制度问答全链路的可运行重建"
requires-python = ">=3.11"
dependencies = [
    "pymilvus>=2.5",
    "milvus-lite>=3.2",
    "elasticsearch>=8.15,<9",
    "minio>=7.2",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live: connects to local Milvus, Elasticsearch, object storage, and the metadata database",
    "memory: in-memory stand-in, not the storage-layer acceptance",
]
